services:
  mysql:
    image: mysql:8.4
    container_name: shinnoderibarii-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: delivery_order
      MYSQL_USER: app
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp", "-papp_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: